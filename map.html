<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caversham Map & Directions</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#eef7e8;color:#1f3a1f}
header{background:#2f6b3a;color:#fff;padding:12px 14px}h1{margin:0;font-size:20px}
header a{color:#fff;font-size:14px}
.ctl{padding:10px 12px;display:grid;gap:8px}
label{font-size:14px;font-weight:600}select{font-size:18px;padding:10px;border-radius:12px;border:2px solid #2f6b3a;width:100%;background:#fff}
.mapbox{position:relative;margin:0 8px}
svg{position:absolute;inset:0;width:100%;height:100%}
.steps{background:#fff;margin:10px 12px;border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.steps ol{margin:0;padding-left:22px;font-size:18px;line-height:1.5}.steps .h{font-weight:700;font-size:16px;margin-bottom:6px}
.btn{font-size:16px;padding:10px;border-radius:12px;border:0;background:#e07b00;color:#fff;font-weight:700}
.note{font-size:13px;color:#557;padding:4px 14px 30px}
</style></head><body>
<header><h1>🗺️ Caversham map & directions</h1><a href="./">← Shows today</a></header>
<div class="ctl">
<div><label>📍 I'm at</label><select id="from"></select></div>
<div><label>🎯 Take me to</label><select id="to"></select></div>
<button class="btn" id="arr">✅ I'm here (set as my spot)</button>
</div>
<div class="steps" id="steps"></div>
<div class="mapbox"><svg viewBox="110 130 520 820" id="svg" style="position:static;background:#cfe9b8;border-radius:16px"></svg></div>
<div class="note">Entrance is at the bottom, Molly's Farm at the top. Tap any icon to go there. GPS is too rough inside a small park, so tap "I'm here" when you arrive.</div>
<script>
const BG=`
<rect x="185" y="150" width="250" height="160" rx="22" fill="#f3e3b5"/><text x="215" y="180" font-size="18" font-weight="700" fill="#7a5a1a">Molly's Farm</text>
<ellipse cx="200" cy="560" rx="85" ry="110" fill="#b5dc9a"/><text x="140" y="500" font-size="15" font-weight="700" fill="#2f6b3a">South-West</text>
<ellipse cx="310" cy="650" rx="55" ry="120" fill="#e9d9a8" transform="rotate(-20 310 650)"/><text x="255" y="610" font-size="14" font-weight="700" fill="#7a5a1a">Kangaroo</text>
<ellipse cx="470" cy="470" rx="90" ry="90" fill="#b5dc9a"/><text x="455" y="425" font-size="15" font-weight="700" fill="#2f6b3a">North</text>
<ellipse cx="520" cy="660" rx="85" ry="75" fill="#c8e6f0"/><text x="495" y="610" font-size="15" font-weight="700" fill="#245b78">Koalas</text>
<ellipse cx="250" cy="850" rx="100" ry="70" fill="#b5dc9a"/><text x="190" y="905" font-size="15" font-weight="700" fill="#2f6b3a">North-East</text>
<rect x="390" y="790" width="80" height="140" rx="10" fill="#f6efe2" stroke="#999"/><text x="400" y="945" font-size="14" font-weight="700" fill="#555">Entrance</text>`;
const N={
entry:[425,815,"Entrance / Exit 🚪"],
kiosk:[420,900,"Kiosk & toilets 🍟"],
k1:[428,700,"path"],
koala:[548,650,"Meet the Koalas 🐨"],
toil2:[492,768,"Toilets (near koalas) 🚻"],
j1:[333,575,"path"],
north:[440,500,"North Section 🦤"],
reptile:[345,470,"Reptile House 🐍"],
wombat:[345,405,"Wombat & Friends 🦔"],
pic1:[275,367,"Picnic & toilets (middle) 🧺"],
fg:[300,318,"path"],
farm:[400,268,"Farm Show 🐄"],
molly:[270,225,"Molly's Farm 🐑"],
sw:[205,640,"South-West Section 🐢"],
roo:[300,660,"Kangaroo Walkthrough 🦘"],
ne:[265,840,"North-East Section 🐫"]};
const E=[["entry","kiosk"],["entry","k1"],["k1","koala"],["k1","toil2"],["k1","j1"],["j1","north"],["j1","reptile"],["reptile","north"],["reptile","wombat"],["wombat","pic1"],["wombat","fg"],["fg","farm"],["fg","molly"],["j1","sw"],["j1","roo"],["roo","ne"],["ne","entry"]];
const places=Object.keys(N).filter(k=>N[k][2]!="path");
const A={};for(const[a,b]of E){(A[a]=A[a]||[]).push(b);(A[b]=A[b]||[]).push(a)}
const d=(a,b)=>Math.hypot(N[a][0]-N[b][0],N[a][1]-N[b][1]);
function route(s,t){const D={},P={},Q=new Set(Object.keys(N));for(const k of Q)D[k]=1e9;D[s]=0;
while(Q.size){let u=null;for(const k of Q)if(u==null||D[k]<D[u])u=k;Q.delete(u);if(u==t)break;for(const v of A[u]||[]){const x=D[u]+d(u,v);if(x<D[v]){D[v]=x;P[v]=u}}}
const r=[t];while(r[0]!=s)r.unshift(P[r[0]]);return r}
function dir(a,b){const dx=N[b][0]-N[a][0],dy=N[b][1]-N[a][1];
if(Math.abs(dy)>Math.abs(dx)*1.2)return dy<0?"⬆️ up the path (towards the farm)":"⬇️ down the path (towards the entrance)";
return dx>0?"➡️ to the right":"⬅️ to the left"}
const nm=k=>N[k][2]=="path"?"the path junction":N[k][2];
const F=document.getElementById('from'),T=document.getElementById('to');
for(const k of places){F.add(new Option(N[k][2],k));T.add(new Option(N[k][2],k))}
F.value=localStorage.cvFrom||"entry";T.value=localStorage.cvTo||"koala";
function draw(){const s=F.value,t=T.value;localStorage.cvFrom=s;localStorage.cvTo=t;
const svg=document.getElementById('svg'),st=document.getElementById('steps');
let h=BG;for(const[a,b]of E)h+=`<line x1="${N[a][0]}" y1="${N[a][1]}" x2="${N[b][0]}" y2="${N[b][1]}" stroke="#a8875a" stroke-width="12" stroke-linecap="round"/>`;
for(const k of places){const em=[...N[k][2]].slice(-2).join('').trim();h+=`<g data-k="${k}" style="cursor:pointer"><circle cx="${N[k][0]}" cy="${N[k][1]}" r="20" fill="#fff" stroke="#2f6b3a" stroke-width="3"/><text x="${N[k][0]}" y="${N[k][1]+8}" font-size="22" text-anchor="middle">${em}</text></g>`}
if(s==t){st.innerHTML='<div class="h">You\'re already here 🎉</div>';}
else{const r=route(s,t);const pts=r.map(k=>N[k][0]+','+N[k][1]).join(' ');
h+=`<polyline points="${pts}" fill="none" stroke="#e07b00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
let li='';for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1];li+=`<li>Walk ${dir(a,b)} to <b>${N[b][2]=="path"?"the fork in the path":N[b][2]}</b></li>`}
st.innerHTML=`<div class="h">${N[s][2]} → ${N[t][2]}</div><ol>${li}</ol>`}
h+=`<circle cx="${N[s][0]}" cy="${N[s][1]}" r="26" fill="none" stroke="#1e6fd9" stroke-width="6"/><text x="${N[s][0]}" y="${N[s][1]-32}" font-size="16" font-weight="800" text-anchor="middle" fill="#1e6fd9">YOU</text>`;
h+=`<circle cx="${N[t][0]}" cy="${N[t][1]}" r="26" fill="none" stroke="#e0262b" stroke-width="6"/><text x="${N[t][0]}" y="${N[t][1]-32}" font-size="16" font-weight="800" text-anchor="middle" fill="#e0262b">GO</text>`;
svg.innerHTML=h;
svg.querySelectorAll('g[data-k]').forEach(c=>c.onclick=()=>{T.value=c.dataset.k;draw()})}
F.onchange=T.onchange=draw;
document.getElementById('arr').onclick=()=>{F.value=T.value;draw()};
draw();
</script></body></html>
